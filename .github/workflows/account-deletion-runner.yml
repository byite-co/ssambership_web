# 계정 삭제 saga 러너 — 수동 백업 트리거.
#
# 주 드라이버는 vercel.json 의 크론(/api/cron/account-deletion, 매일 18:25 UTC)이다.
# 이 워크플로는 스케줄 없이 workflow_dispatch 전용으로 남겨, 크론 사이클을
# 기다리지 않고 러너를 즉시 한 번 돌려야 할 때(배포 검증·잔여 잡 소화) 쓴다.
#
# real-run 신호는 Vercel env ACCOUNT_DELETION_CRON_REAL_RUN 이 주 경로다 —
# 여기서는 쿼리스트링을 싣지 않는다. 실삭제는 라우트의 3중 안전장치
# (① ACCOUNT_DELETION_WORKER_ENABLED ② 기능 플래그 ③ real-run 신호)를
# 그대로 거치며, 하나라도 어긋나면 dry-run 으로 강등된다.
#
# 필요한 저장소 시크릿: CRON_SECRET (Vercel env 의 CRON_SECRET 과 동일 값).
name: account-deletion-runner

on:
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: account-deletion-runner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Invoke account deletion saga runner
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repository secret is not set" >&2
            exit 1
          fi
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://www.ssambership.com/api/cron/account-deletion"
