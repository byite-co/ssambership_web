name: db adoption repair (Strategy A)

# 부모 Supabase 프로젝트의 migration history 에 Strategy A 이력 7건을 기록한다.
#
# 이 워크플로가 하는 일 / 하지 않는 일
#   한다  : supabase migration repair --status applied|reverted <version>  (추적 테이블만 변경)
#   안 한다: baseline DDL 188 조각 재적용 · schema 변경 · 사용자 데이터 변경 · db push
#
# 안전 장치 (4중)
#   1. workflow_dispatch 전용 — push/PR/schedule 로 절대 트리거되지 않는다.
#   2. GitHub Environment `supabase-db-adoption` 승인 게이트(사람 승인 필요).
#   3. mode 기본값이 dry-run 이다. 실행하려면 사람이 명시적으로 바꿔야 한다.
#   4. confirmation 문자열이 정확히 일치해야 한다(부모 project ref 포함).
#
# 필요한 Environment secret
#   SUPABASE_DB_URL   부모 프로젝트 Postgres 연결 문자열 (repair 대상)
#
# 실행 전 확인
#   * PR #61 이 병합되어 이 ref 의 supabase/migrations 에 pack 63본이 있어야 한다.
#   * 실행 후 부모 ledger 는 56 → 63 이 된다. schema 는 변하지 않아야 한다(전후 지문 대조로 강제).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드'
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - execute-repair
          - execute-revert
      confirmation:
        description: 'execute 시 필수. repair=REPAIR_7_HISTORY_RECORDS_ON_lbeqxarxothkmzqvpudy / revert=REVERT_7_HISTORY_RECORDS_ON_lbeqxarxothkmzqvpudy'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: db-adoption-repair-parent
  cancel-in-progress: false   # 진행 중인 repair 를 중간에 끊지 않는다

env:
  SUPABASE_CLI_VERSION: '2.111.0'   # pinned — latest floating 금지
  PARENT_PROJECT_REF: lbeqxarxothkmzqvpudy
  CONFIRM_REPAIR: REPAIR_7_HISTORY_RECORDS_ON_lbeqxarxothkmzqvpudy
  CONFIRM_REVERT: REVERT_7_HISTORY_RECORDS_ON_lbeqxarxothkmzqvpudy
  EXPECT_LEDGER_BEFORE_REPAIR: '56'
  EXPECT_LEDGER_AFTER_REPAIR: '63'

jobs:
  repair:
    name: 'migration history repair (${{ inputs.mode }})'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: supabase-db-adoption   # 사람 승인 게이트
    steps:
      - uses: actions/checkout@v4

      - name: 확인 문자열 검사 (dry-run 이 아니면 정확 일치 필수)
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          GIVEN: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          case "$MODE" in
            dry-run) echo "MODE=dry-run — 부모에 어떤 쓰기도 하지 않는다"; exit 0 ;;
            execute-repair) WANT="$CONFIRM_REPAIR" ;;
            execute-revert) WANT="$CONFIRM_REVERT" ;;
            *) echo "::error::알 수 없는 mode: $MODE"; exit 1 ;;
          esac
          if [ "$GIVEN" != "$WANT" ]; then
            echo "::error::confirmation 불일치. mode=$MODE 에는 정확히 '$WANT' 가 필요하다."
            exit 1
          fi
          echo "CONFIRMATION: OK ($MODE)"

      - name: repair 계획 검증 (7건 · ddl=no · schema=no · 파일 존재)
        shell: bash
        run: |
          set -euo pipefail
          PLAN=supabase/baseline/adoption_repair_plan.tsv
          n=$(tail -n +2 "$PLAN" | grep -c . )
          [ "$n" = "7" ] || { echo "::error::repair plan 이 $n 행이다 (7 기대)"; exit 1; }
          tail -n +2 "$PLAN" | while IFS=$'\t' read -r order version kind src cur req ddl sch notes; do
            [ "$ddl" = "no" ] || { echo "::error::$version ddl_executed=$ddl"; exit 1; }
            [ "$sch" = "no" ] || { echo "::error::$version schema_change_expected=$sch"; exit 1; }
            ls "supabase/migrations/${version}_"*.sql >/dev/null 2>&1 \
              || { echo "::error::$version 에 해당하는 migration 파일이 이 ref 에 없다 (PR #61 병합 필요)"; exit 1; }
          done
          tail -n +2 "$PLAN" | cut -f2 > repair_versions.txt
          echo "REPAIR_VERSIONS:"; cat repair_versions.txt
          cnt=$(ls supabase/migrations/*.sql | wc -l)
          echo "이 ref 의 migration 파일 수: $cnt"
          [ "$cnt" -ge 63 ] || { echo "::error::migration 파일 $cnt 개 — pack 63본이 있어야 한다"; exit 1; }

      - name: pack 정적 검증 재실행
        run: python3 scripts/verify/baseline/validate_native_migration_pack.py

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: CLI 계약 확인 (사용할 플래그가 실제로 존재하는지)
        shell: bash
        run: |
          set -euo pipefail
          supabase --version | tee cli-version.txt
          supabase migration repair --help > cli-repair-help.txt 2>&1 || true
          cat cli-repair-help.txt
          for flag in --status --db-url; do
            grep -q -- "$flag" cli-repair-help.txt \
              || { echo "::error::CLI 에 $flag 플래그가 없다 — 버전 계약이 바뀌었다. 수동 확인 필요."; exit 1; }
          done
          grep -qE 'applied|reverted' cli-repair-help.txt \
            || { echo "::error::--status 값(applied/reverted) 을 CLI help 에서 확인할 수 없다"; exit 1; }
          echo "CLI_CONTRACT: OK"

      - name: 부모 사전 상태 캡처 (읽기 전용)
        if: inputs.mode != 'dry-run'
        shell: bash
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          [ -n "$PGURL" ] || { echo "::error::Environment secret SUPABASE_DB_URL 이 없다"; exit 1; }
          mkdir -p parent-evidence
          psql "$PGURL" -At -c \
            "select version from supabase_migrations.schema_migrations order by version" \
            > parent-evidence/ledger_before.txt
          before=$(wc -l < parent-evidence/ledger_before.txt)
          echo "ledger_before=$before"
          if [ "${{ inputs.mode }}" = "execute-repair" ]; then
            [ "$before" = "$EXPECT_LEDGER_BEFORE_REPAIR" ] \
              || { echo "::error::ledger 가 $before 행이다 ($EXPECT_LEDGER_BEFORE_REPAIR 기대). 이미 적용됐거나 상태가 다르다."; exit 1; }
            while read -r v; do
              if grep -qx "$v" parent-evidence/ledger_before.txt; then
                echo "::error::$v 가 이미 ledger 에 있다 — repair 를 중복 실행하려 한다"; exit 1
              fi
            done < repair_versions.txt
          else
            [ "$before" = "$EXPECT_LEDGER_AFTER_REPAIR" ] \
              || { echo "::error::ledger 가 $before 행이다 ($EXPECT_LEDGER_AFTER_REPAIR 기대). revert 전제가 성립하지 않는다."; exit 1; }
            while read -r v; do
              grep -qx "$v" parent-evidence/ledger_before.txt \
                || { echo "::error::$v 가 ledger 에 없다 — revert 대상이 아니다"; exit 1; }
            done < repair_versions.txt
          fi
          # schema 무변경을 강제하기 위한 사전 지문 (읽기 전용)
          bash scripts/verify/baseline/parent_schema_fingerprint.sh "$PGURL" > parent-evidence/fingerprint_before.txt
          echo "fingerprint_before:"; cat parent-evidence/fingerprint_before.txt

      - name: DRY-RUN — 실행될 명령만 출력
        if: inputs.mode == 'dry-run'
        shell: bash
        run: |
          set -euo pipefail
          echo "=== dry-run: 아래 명령이 execute 모드에서 실행된다 (지금은 실행하지 않는다) ==="
          while read -r v; do
            echo "supabase migration repair --status applied  $v --db-url \$SUPABASE_DB_URL   # execute-repair"
            echo "supabase migration repair --status reverted $v --db-url \$SUPABASE_DB_URL   # execute-revert"
          done < repair_versions.txt
          echo "=== 부모 DB 접속 0회 · 쓰기 0회 ==="

      - name: EXECUTE — migration history repair
        if: inputs.mode != 'dry-run'
        shell: bash
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          STATUS=applied
          [ "${{ inputs.mode }}" = "execute-revert" ] && STATUS=reverted
          echo "repair --status $STATUS × $(wc -l < repair_versions.txt)"
          while read -r v; do
            echo "--- $v ---"
            supabase migration repair --status "$STATUS" "$v" --db-url "$PGURL"
          done < repair_versions.txt

      - name: 부모 사후 검증 (ledger 증감 정확 · schema 무변경)
        if: inputs.mode != 'dry-run'
        shell: bash
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$PGURL" -At -c \
            "select version from supabase_migrations.schema_migrations order by version" \
            > parent-evidence/ledger_after.txt
          after=$(wc -l < parent-evidence/ledger_after.txt)
          echo "ledger_after=$after"
          if [ "${{ inputs.mode }}" = "execute-repair" ]; then
            want="$EXPECT_LEDGER_AFTER_REPAIR"
          else
            want="$EXPECT_LEDGER_BEFORE_REPAIR"
          fi
          [ "$after" = "$want" ] || { echo "::error::ledger 가 $after 행이다 ($want 기대)"; exit 1; }
          # 변경분이 정확히 계획된 7건인지
          diff <(sort parent-evidence/ledger_before.txt) <(sort parent-evidence/ledger_after.txt) \
            | grep -E '^[<>]' | sed 's/^[<>] //' | sort > parent-evidence/ledger_delta.txt || true
          if ! diff -q <(sort repair_versions.txt) parent-evidence/ledger_delta.txt >/dev/null; then
            echo "::error::ledger 변경분이 계획과 다르다"; diff <(sort repair_versions.txt) parent-evidence/ledger_delta.txt; exit 1
          fi
          echo "LEDGER_DELTA: 계획된 7건과 정확히 일치"
          bash scripts/verify/baseline/parent_schema_fingerprint.sh "$PGURL" > parent-evidence/fingerprint_after.txt
          if ! diff -u parent-evidence/fingerprint_before.txt parent-evidence/fingerprint_after.txt; then
            echo "::error::schema 지문이 변했다 — repair 는 schema 를 바꾸면 안 된다"; exit 1
          fi
          echo "SCHEMA_FINGERPRINT: NO_CHANGE_DETECTED_ON_CAPTURED_AXES"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: db-adoption-repair-${{ inputs.mode }}-${{ github.run_id }}
          path: |
            cli-version.txt
            cli-repair-help.txt
            repair_versions.txt
            parent-evidence/**
          retention-days: 90
