name: db apply pending migrations

# 부모 Supabase 프로젝트에 '적용 시점 미적용 전량'을 정식 migration 경로로 적용한다 (D-DB-1 · 오너 결정 3, 2026-08-07).
#
# 이 워크플로가 하는 일 / 하지 않는 일
#   한다  : supabase db push --db-url  (pending 전량만 적용 — CLI 가 원장과 대조해 산출)
#   안 한다: 이미 적용된 migration 재실행 · migration history 추적 테이블 직접 기록 · 사용자 데이터 변경
#
# 적용 대상은 고정 목록이 아니다. 실행 시점에 (로컬 pack) − (원장) 차집합을 계산해
# 그 전량을 적용하고, 사후에 원장 증가분이 그 차집합과 정확히 일치하는지 검증한다.
# (2026-08-07 실측 기준 pending 9본이지만 이 수를 하드코딩하지 않는다.)
#
# 안전 장치 (4중)
#   1. workflow_dispatch 전용 — push/PR/schedule 로 절대 트리거되지 않는다.
#   2. GitHub Environment `supabase-db-adoption` 승인 게이트(사람 승인 필요).
#   3. mode 기본값이 dry-run 이다(부모 접속 0회). 실행하려면 사람이 명시적으로 바꿔야 한다.
#   4. confirmation 문자열이 정확히 일치해야 한다(부모 project ref 포함).
#
# 필요한 Environment secret
#   SUPABASE_DB_URL   부모 프로젝트 Postgres 연결 문자열
#
# 실행 전 확인
#   * main(또는 적용하려는 병합본) ref 에서 실행해야 한다 — pending 산출이 ref 의 pack 기준이다.
#   * schema 는 변하는 것이 정상이다(실제 DDL 적용). 지문은 전후 증적으로 남기되 무변경을 강제하지 않는다.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드'
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - apply
      confirmation:
        description: 'apply 시 필수. APPLY_PENDING_MIGRATIONS_TO_lbeqxarxothkmzqvpudy'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: db-adoption-repair-parent   # 부모를 만지는 워크플로 공통 그룹 — 동시 실행 금지
  cancel-in-progress: false          # 진행 중인 적용을 중간에 끊지 않는다

env:
  SUPABASE_CLI_VERSION: '2.111.0'   # pinned — latest floating 금지
  PARENT_PROJECT_REF: lbeqxarxothkmzqvpudy
  CONFIRM_APPLY: APPLY_PENDING_MIGRATIONS_TO_lbeqxarxothkmzqvpudy

jobs:
  apply:
    name: 'pending 전량 적용 (${{ inputs.mode }})'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: supabase-db-adoption   # 사람 승인 게이트
    steps:
      - uses: actions/checkout@v4

      - name: 확인 문자열 검사 (dry-run 이 아니면 정확 일치 필수)
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          GIVEN: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          case "$MODE" in
            dry-run) echo "MODE=dry-run — 부모에 어떤 접속·쓰기도 하지 않는다"; exit 0 ;;
            apply) WANT="$CONFIRM_APPLY" ;;
            *) echo "::error::알 수 없는 mode: $MODE"; exit 1 ;;
          esac
          if [ "$GIVEN" != "$WANT" ]; then
            echo "::error::confirmation 불일치. mode=$MODE 에는 정확히 '$WANT' 가 필요하다."
            exit 1
          fi
          echo "CONFIRMATION: OK ($MODE)"

      - name: pack 정적 검증 재실행
        run: python3 scripts/verify/baseline/validate_native_migration_pack.py

      - name: 로컬 pack version 목록 산출
        shell: bash
        run: |
          set -euo pipefail
          ls supabase/migrations/*.sql | xargs -n1 basename | cut -c1-14 | sort > local_versions.txt
          cnt=$(grep -c . local_versions.txt)
          echo "이 ref 의 migration 파일 수: $cnt"
          [ "$cnt" -ge 81 ] || { echo "::error::migration 파일이 $cnt 개다 — 통합 pack(81본 이상)에서 실행해야 한다"; exit 1; }

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: CLI 계약 확인 (사용할 플래그가 실제로 존재하는지)
        shell: bash
        run: |
          set -euo pipefail
          supabase --version | tee cli-version.txt
          supabase db push --help > cli-push-help.txt 2>&1 || true
          cat cli-push-help.txt
          grep -q -- '--db-url' cli-push-help.txt \
            || { echo "::error::db push 에 --db-url 플래그가 없다 — CLI 계약이 바뀌었다. 수동 확인 필요."; exit 1; }
          echo "CLI_CONTRACT: OK"

      - name: 부모 사전 상태 캡처 + pending 차집합 산출 (읽기 전용)
        if: inputs.mode != 'dry-run'
        shell: bash
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          [ -n "$PGURL" ] || { echo "::error::Environment secret SUPABASE_DB_URL 이 없다"; exit 1; }
          mkdir -p parent-evidence
          psql "$PGURL" -At -c \
            "select version from supabase_migrations.schema_migrations order by version" \
            > parent-evidence/ledger_before.txt
          before=$(grep -c . parent-evidence/ledger_before.txt || true)
          echo "ledger_before=$before"
          # 원장에만 있고 이 ref 에 없는 version 이 있으면 잘못된 ref 다 — 즉시 중단
          comm -23 <(sort parent-evidence/ledger_before.txt) local_versions.txt > parent-evidence/remote_only.txt
          if [ -s parent-evidence/remote_only.txt ]; then
            echo "::error::원장에는 있는데 이 ref 의 pack 에 없는 version 이 있다 — ref 를 확인하라"
            cat parent-evidence/remote_only.txt; exit 1
          fi
          # 적용 시점 미적용 전량 = (로컬 pack) − (원장)
          comm -13 <(sort parent-evidence/ledger_before.txt) local_versions.txt > pending_versions.txt
          n=$(grep -c . pending_versions.txt || true)
          [ "$n" -ge 1 ] || { echo "::error::pending 이 0본이다 — 적용할 것이 없다(이미 최신)"; exit 1; }
          echo "PENDING(${n}본):"; cat pending_versions.txt
          # 전후 대조용 schema 지문 (증적 — DDL 적용이므로 변경이 정상)
          bash scripts/verify/baseline/parent_schema_fingerprint.sh "$PGURL" > parent-evidence/fingerprint_before.txt

      - name: DRY-RUN — 실행될 명령만 출력
        if: inputs.mode == 'dry-run'
        shell: bash
        run: |
          set -euo pipefail
          echo "=== dry-run: apply 모드에서 실행될 명령 (지금은 실행하지 않는다) ==="
          echo "supabase db push --db-url \$SUPABASE_DB_URL   # 원장과 대조해 pending 전량만 적용"
          echo "적용 대상은 apply 시점에 (로컬 pack) − (원장) 차집합으로 산출·기록된다."
          echo "=== 부모 DB 접속 0회 · 쓰기 0회 ==="

      - name: APPLY — pending 전량 적용
        if: inputs.mode == 'apply'
        shell: bash
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          supabase db push --db-url "$PGURL" 2>&1 | tee push.log

      - name: 부모 사후 검증 (원장 증가분 = 사전 pending 정확 일치)
        if: inputs.mode == 'apply'
        shell: bash
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$PGURL" -At -c \
            "select version from supabase_migrations.schema_migrations order by version" \
            > parent-evidence/ledger_after.txt
          after=$(grep -c . parent-evidence/ledger_after.txt || true)
          want=$(grep -c . local_versions.txt)
          echo "ledger_after=$after (기대 $want = 로컬 pack 전량)"
          [ "$after" = "$want" ] || { echo "::error::ledger 가 $after 행이다 ($want 기대)"; exit 1; }
          diff <(sort parent-evidence/ledger_before.txt) <(sort parent-evidence/ledger_after.txt) \
            | grep -E '^[<>]' | sed 's/^[<>] //' | sort > parent-evidence/ledger_delta.txt || true
          if ! diff -q <(sort pending_versions.txt) parent-evidence/ledger_delta.txt >/dev/null; then
            echo "::error::원장 증가분이 사전 산출한 pending 과 다르다"
            diff <(sort pending_versions.txt) parent-evidence/ledger_delta.txt; exit 1
          fi
          echo "LEDGER_DELTA: 사전 pending 과 정확히 일치 ($(grep -c . pending_versions.txt)본)"
          bash scripts/verify/baseline/parent_schema_fingerprint.sh "$PGURL" > parent-evidence/fingerprint_after.txt
          echo "=== fingerprint diff (DDL 적용이므로 변경이 정상 — 증적으로만 남긴다) ==="
          diff -u parent-evidence/fingerprint_before.txt parent-evidence/fingerprint_after.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: db-apply-pending-${{ inputs.mode }}-${{ github.run_id }}
          path: |
            cli-version.txt
            cli-push-help.txt
            local_versions.txt
            pending_versions.txt
            push.log
            parent-evidence/**
          retention-days: 90
