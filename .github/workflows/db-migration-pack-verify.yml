name: db migration pack verify

# 정식 migration pack 정적 검증 + PostgreSQL 17 + 실제 Supabase CLI migration runner 검증.
# 부모 프로젝트에 접속하지 않는다. secret 을 사용하지 않는다.
on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/verify/**'
      - '.github/workflows/db-migration-pack-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-pack-verify-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_CLI_VERSION: '2.111.0'   # pinned — latest floating 금지

jobs:
  static:
    name: pack static validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: generator determinism (재생성 diff 0)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify/baseline/build_native_baseline_migration.py
          python3 scripts/verify/baseline/build_native_migration_pack.py
          if ! git diff --quiet; then
            echo "::error::생성기 재실행 결과가 커밋본과 다르다 (비결정론 또는 stale 산출물)"
            git --no-pager diff --stat
            exit 1
          fi
          echo "GENERATOR_DETERMINISTIC: PASS"
      - name: pack validator
        run: python3 scripts/verify/baseline/validate_native_migration_pack.py
      - name: replay manifest validator
        run: bash scripts/verify/baseline/validate_replay_manifest.sh
      - name: workflow static validation (+ 검증기 자체 실패 탐지 시험)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'pyyaml==6.0.2'
          python3 scripts/verify/baseline/validate_db_workflows.py
          python3 scripts/verify/baseline/validate_db_workflows.py --selftest
      - name: secret scan (값 기준, + 규칙 자체 시험)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify/baseline/scan_repo_secrets.py --selftest
          python3 scripts/verify/baseline/scan_repo_secrets.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-migration-pack-static-${{ github.sha }}
          path: |
            supabase/baseline/native_baseline_manifest.json
            supabase/baseline/native_baseline_source_map.tsv
            supabase/baseline/native_migration_pack_manifest.tsv
          retention-days: 14

  pg17-cli-replay:
    name: PostgreSQL 17 + Supabase CLI runner
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: CLI 계약 확인 (명령을 기억으로 추측하지 않는다)
        shell: bash
        run: |
          set -euo pipefail
          supabase --version | tee cli-version.txt
          supabase --help > cli-help.txt 2>&1 || true
          supabase db --help > cli-db-help.txt 2>&1 || true
          supabase migration --help > cli-migration-help.txt 2>&1 || true
          echo "--- db help ---"; cat cli-db-help.txt
          echo "--- migration help ---"; cat cli-migration-help.txt
      - name: config major_version 확인
        shell: bash
        run: |
          set -euo pipefail
          grep -E '^\s*major_version\s*=\s*17' supabase/config.toml \
            || { echo "::error::config.toml major_version 이 17 이 아니다"; exit 1; }
      # `supabase start` 는 supabase/migrations 를 자동 적용한다. 그러면 적용 **전** 플랫폼
      # 상태를 관측할 기회가 사라진다. pack 의 자체 검사(예: BATCH_F_M11)는 그 초기 상태를
      # 전제하므로, 먼저 pack 을 치워 두고 빈 상태로 스택을 띄운다.
      - name: pack 대피 (적용 전 플랫폼 상태를 관측하기 위해)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pack
          mv supabase/migrations/*.sql /tmp/pack/
          echo "대피한 migration: $(ls /tmp/pack/*.sql | wc -l)본"
      - name: local stack 시작 (pack 미적용 상태)
        shell: bash
        run: |
          set -euo pipefail
          supabase start 2>&1 | tail -20
      - name: 플랫폼 초기 상태 실측 (이 job 의 1차 산출물)
        shell: bash
        run: bash scripts/verify/baseline/capture_platform_baseline.sh
      - name: 호스팅 프로젝트 전제 확립 (로컬 스택 ↔ 호스팅 차이 보정)
        shell: bash
        run: |
          set -euo pipefail
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 -f scripts/verify/baseline/local_stack_preconditions.sql
          echo "재실측(전제 확립 후):"
          EVIDENCE_DIR="$GITHUB_WORKSPACE/pg17-evidence/after-preconditions" \
            bash scripts/verify/baseline/capture_platform_baseline.sh | tail -4
      - name: pack 복원 + 실제 CLI migration runner 로 적용
        shell: bash
        run: |
          set -euo pipefail
          mv /tmp/pack/*.sql supabase/migrations/
          echo "복원한 migration: $(ls supabase/migrations/*.sql | wc -l)본"
          # 플래그를 기억으로 추측하지 않는다 — help 로 존재를 확인하고 있을 때만 쓴다.
          supabase migration up --help > cli-up-help.txt 2>&1 || true
          UP_FLAGS=""
          if grep -q -- '--local' cli-up-help.txt; then UP_FLAGS="--local"; fi
          echo "migration up flags: '${UP_FLAGS}'"
          supabase migration up ${UP_FLAGS} 2>&1 | tail -40
      - name: migration history / 구조 검증
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --help > cli-list-help.txt 2>&1 || true
          LIST_FLAGS=""
          if grep -q -- '--local' cli-list-help.txt; then LIST_FLAGS="--local"; fi
          supabase migration list ${LIST_FLAGS} 2>&1 | tee migration-list.txt
          bash scripts/verify/baseline/verify_local_stack_state.sh
      - name: stack 정리
        if: always()
        run: supabase stop --no-backup || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-migration-pack-pg17-${{ github.sha }}
          path: |
            cli-version.txt
            cli-*-help.txt
            migration-list.txt
            pg17-evidence/**
          retention-days: 14
