name: db migration pack verify

# 정식 migration pack 정적 검증 + PostgreSQL 17 + 실제 Supabase CLI migration runner 검증.
# 부모 프로젝트에 접속하지 않는다. secret 을 사용하지 않는다.
on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/verify/**'
      - '.github/workflows/db-migration-pack-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-pack-verify-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_CLI_VERSION: '2.111.0'   # pinned — latest floating 금지

jobs:
  static:
    name: pack static validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: generator determinism (재생성 diff 0)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify/baseline/build_native_baseline_migration.py
          python3 scripts/verify/baseline/build_native_migration_pack.py
          if ! git diff --quiet; then
            echo "::error::생성기 재실행 결과가 커밋본과 다르다 (비결정론 또는 stale 산출물)"
            git --no-pager diff --stat
            exit 1
          fi
          echo "GENERATOR_DETERMINISTIC: PASS"
      - name: pack validator
        run: python3 scripts/verify/baseline/validate_native_migration_pack.py
      - name: replay manifest validator
        run: bash scripts/verify/baseline/validate_replay_manifest.sh
      - name: workflow static validation (+ 검증기 자체 실패 탐지 시험)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'pyyaml==6.0.2'
          python3 scripts/verify/baseline/validate_db_workflows.py
          python3 scripts/verify/baseline/validate_db_workflows.py --selftest
      - name: secret scan (값 기준)
        shell: bash
        run: |
          set -euo pipefail
          if grep -rInE '(sbp_[A-Za-z0-9]{20,}|eyJhbGciOi[A-Za-z0-9_-]{10,}|postgres(ql)?://[^ ]*:[^ ]*@)' \
               supabase/migrations supabase/baseline scripts/verify 2>/dev/null; then
            echo "::error::secret 값 형태가 검출됐다"; exit 1
          fi
          echo "SECRET_SCAN: PASS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-migration-pack-static-${{ github.sha }}
          path: |
            supabase/baseline/native_baseline_manifest.json
            supabase/baseline/native_baseline_source_map.tsv
            supabase/baseline/native_migration_pack_manifest.tsv
          retention-days: 14

  pg17-cli-replay:
    name: PostgreSQL 17 + Supabase CLI runner
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: CLI 계약 확인 (명령을 기억으로 추측하지 않는다)
        shell: bash
        run: |
          set -euo pipefail
          supabase --version | tee cli-version.txt
          supabase --help > cli-help.txt 2>&1 || true
          supabase db --help > cli-db-help.txt 2>&1 || true
          supabase migration --help > cli-migration-help.txt 2>&1 || true
          echo "--- db help ---"; cat cli-db-help.txt
          echo "--- migration help ---"; cat cli-migration-help.txt
      - name: config major_version 확인
        shell: bash
        run: |
          set -euo pipefail
          grep -E '^\s*major_version\s*=\s*17' supabase/config.toml \
            || { echo "::error::config.toml major_version 이 17 이 아니다"; exit 1; }
      - name: local stack 시작 (migration runner 가 supabase/migrations 를 읽는다)
        shell: bash
        run: |
          set -euo pipefail
          supabase start 2>&1 | tail -20
      - name: migration history / 구조 검증
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list 2>&1 | tee migration-list.txt
          bash scripts/verify/baseline/verify_local_stack_state.sh
      - name: stack 정리
        if: always()
        run: supabase stop --no-backup || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-migration-pack-pg17-${{ github.sha }}
          path: |
            cli-version.txt
            cli-*-help.txt
            migration-list.txt
            pg17-evidence/**
          retention-days: 14
