name: db observe CI session (read only)

# LOCAL DRAFT ONLY: publication and dispatch have not been authorized/executed.
# No apply/repair mode or arbitrary SQL/ref/connection input.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-adoption-repair-parent
  cancel-in-progress: false

jobs:
  observe:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'byite-co/ssambership_web'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: supabase-db-adoption
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify reviewed source and installed client
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          command -v psql >/dev/null
          psql --version
      - name: Observe the Environment connection without writes
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          python3 scripts/verify/staging_ci_observation/observe.py --output "$RUNNER_TEMP/staging-ci-observation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Retain observation or sanitized failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-ci-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staging-ci-observation-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: ignore
          retention-days: 7
