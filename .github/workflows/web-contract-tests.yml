name: web contract tests

# 웹 계약 테스트 게이트 (npm run test:contract).
# mentor_profiles/users 직접 읽기 차단 트리 walk 등 lib/**/__contract__ 전체를 실행한다.
# 부모 프로젝트에 접속하지 않는다. secret 을 사용하지 않는다.
on:
  pull_request:
    paths:
      - 'app/**'
      - 'lib/**'
      - 'components/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-contract-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-contract-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # --experimental-strip-types 는 22.6+ 필요
          cache: 'npm'
      - name: npm ci
        run: npm ci
      - name: contract tests
        run: npm run test:contract
