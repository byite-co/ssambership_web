name: web checks

# 웹 검사 게이트 3종: eslint · tsc --noEmit · npm run test:contract.
# 계약 테스트는 mentor_profiles/users 직접 읽기 차단 트리 walk 등 lib/**/__contract__ 전체,
# tsc 는 tsconfig include(**/*.ts — app/lib/components/hooks/e2e/scripts 등 저장소 전역)를 검사한다.
# 부모 프로젝트에 접속하지 않는다. secret 을 사용하지 않는다.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.mts'
      - '**/*.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/web-contract-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-contract-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint · typecheck · contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # --experimental-strip-types 는 22.6+ 필요
          cache: 'npm'
      - name: npm ci
        run: npm ci
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npx tsc --noEmit
      - name: contract tests
        run: npm run test:contract
