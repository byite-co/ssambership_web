const SEV_LABEL = {bug:"결함", risk:"잠재 결함", smell:"부정 특이점"};
const state = {sevs:new Set(), doms:new Set(), q:""};
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function allItems(){ return PAYLOAD.GROUPS.flatMap(g=>g.items.map(i=>({...i,_g:g.t}))); }

function match(i){
  if(state.sevs.size && !state.sevs.has(i.sev)) return false;
  if(state.doms.size && !state.doms.has(i._g)) return false;
  if(state.q){
    const hay=(i.id+" "+i.t+" "+(i.sym||"")+" "+(i.cond||"")+" "+(i.impact||"")+" "+(i.ev||"")+" "+(i.rows||[]).join(" ")+" "+(i.fix||"")).toLowerCase();
    if(!hay.includes(state.q)) return false;
  }
  return true;
}

function renderStats(){
  const items=allItems();
  const c={bug:0,risk:0,smell:0};
  items.forEach(i=>c[i.sev]!=null&&c[i.sev]++);
  document.getElementById("stats").innerHTML=
    `<div class="stat"><div class="n">${items.length}</div><div class="l">전체 항목</div></div>`+
    `<div class="stat bug"><div class="n">${c.bug}</div><div class="l">결함 (현재 재현)</div></div>`+
    `<div class="stat risk"><div class="n">${c.risk}</div><div class="l">잠재 결함 (조건부)</div></div>`+
    `<div class="stat smell"><div class="n">${c.smell}</div><div class="l">부정 특이점</div></div>`;
}

function renderChips(){
  const doms=PAYLOAD.GROUPS.map(g=>g.t);
  const c=document.getElementById("chips");
  const chipHtml=["bug","risk","smell"].map(s=>`<button class="chip c-${s}" data-sev="${s}" data-on="0">${SEV_LABEL[s]}</button>`).join("")
    + doms.map(d=>`<button class="chip" data-dom="${esc(d)}" data-on="0">${esc(d)}</button>`).join("");
  c.insertAdjacentHTML("afterbegin", chipHtml);
  c.addEventListener("click",e=>{
    const b=e.target.closest(".chip"); if(!b)return;
    const on=b.dataset.on==="1"; b.dataset.on=on?"0":"1";
    if(b.dataset.sev){ on?state.sevs.delete(b.dataset.sev):state.sevs.add(b.dataset.sev); }
    if(b.dataset.dom){ on?state.doms.delete(b.dataset.dom):state.doms.add(b.dataset.dom); }
    render();
  });
  document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value.trim().toLowerCase();render();});
}

function renderItem(i){
  return `<div class="item sev-${i.sev}" id="${esc(i.id)}">
    <div class="t"><span class="sev sev-b-${i.sev}">${SEV_LABEL[i.sev]||i.sev}</span><span class="did">${esc(i.id)}</span> ${esc(i.t)}
      ${(i.rows||[]).map(r=>`<span class="rowsref">${esc(r)}</span>`).join("")}</div>
    <dl>
      ${i.sym?`<dt>증상</dt><dd>${esc(i.sym)}</dd>`:""}
      ${i.cond?`<dt>조건</dt><dd>${esc(i.cond)}</dd>`:""}
      ${i.impact?`<dt>영향</dt><dd>${esc(i.impact)}</dd>`:""}
      ${i.ev?`<dt>근거</dt><dd class="ev">${esc(i.ev)}</dd>`:""}
      ${i.fix?`<dt>방향</dt><dd class="fix">${esc(i.fix)}</dd>`:""}
    </dl>
  </div>`;
}

function render(){
  let shown=0,total=0;
  document.getElementById("app").innerHTML=PAYLOAD.GROUPS.map(g=>{
    const items=g.items.map(i=>({...i,_g:g.t}));
    const vis=items.filter(match); total+=items.length; shown+=vis.length;
    if(!vis.length) return "";
    const order={bug:0,risk:1,smell:2};
    vis.sort((a,b)=>(order[a.sev]??9)-(order[b.sev]??9));
    return `<section class="grp"><div class="grp-h"><h2>${esc(g.t)}</h2><span class="cnt">${vis.length}/${items.length}건</span></div>${vis.map(renderItem).join("")}</section>`;
  }).join("");
  document.getElementById("countNote").textContent=`${shown} / ${total} 건 표시 중`;
}

document.getElementById("heroSub").innerHTML=PAYLOAD.hero||"";
document.getElementById("metaLine").innerHTML=(PAYLOAD.meta||[]).map(m=>`<span>${m}</span>`).join("");
document.getElementById("foot").innerHTML=PAYLOAD.foot||"";
renderStats(); renderChips(); render();
</script>
