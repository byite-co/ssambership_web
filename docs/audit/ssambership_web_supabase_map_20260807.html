<script>

const KINDS = ["SEL","INS","UPD","UPS","DEL","RPC","STO","AUTH","LOC"];
const KIND_LABEL = {SEL:"SELECT",INS:"INSERT",UPD:"UPDATE",UPS:"UPSERT",DEL:"DELETE",RPC:"RPC",STO:"Storage",AUTH:"Auth",LOC:"로컬"};
const CL_LABEL = {"anon-ssr":"ANON","service-role":"SVC","browser":"BRW","app-surface":"APP","mixed":"MIX"};
const CL_CLASS = {"anon-ssr":"own-anon","service-role":"own-svc","browser":"own-browser","app-surface":"own-appsurf","mixed":"own-mixed"};

const state = {kinds:new Set(), cls:new Set(), q:""};

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function opParts(o){
  const i = o.indexOf("|");
  if(i<0) return {k:o, t:""};
  return {k:o.slice(0,i), t:o.slice(i+1)};
}

function rowKinds(r){ return new Set((r.o&&r.o.length?r.o:["LOC"]).map(o=>opParts(o).k)); }

function rowMatch(r){
  if(state.kinds.size){
    const ks = rowKinds(r);
    if(![...state.kinds].some(k=>ks.has(k))) return false;
  }
  if(state.cls.size && !state.cls.has(r.cl||"anon-ssr")) return false;
  if(state.q){
    const hay = (r.id+" "+r.s+" "+r.f+" "+(r.tr||"")+" "+(r.o||[]).join(" ")+" "+(r.e||"")+" "+(r.m||"")).toLowerCase();
    if(!hay.includes(state.q)) return false;
  }
  return true;
}

function renderStats(){
  const rows = PAYLOAD.AREAS.flatMap(a=>a.rows);
  const opCount = {}; KINDS.forEach(k=>opCount[k]=0);
  const tables=new Set(), rpcs=new Set(), buckets=new Set();
  const dbTables=new Set(PAYLOAD.DB.tables||[]);
  rows.forEach(r=>(r.o&&r.o.length?r.o:["LOC"]).forEach(o=>{
    const {k,t}=opParts(o); if(opCount[k]!=null)opCount[k]++;
    if(t.includes("(부재)")) return; // 실존하지 않는 테이블 프로브는 커버리지 제외
    const base=t.split("(")[0].trim();
    if(["SEL","INS","UPD","UPS","DEL"].includes(k)){
      if(base.startsWith("api_web_v1.")||dbTables.has(base)) tables.add(base);
    }
    if(k==="RPC") rpcs.add(base);
    if(k==="STO") buckets.add(base.split(":")[0].trim());
  }));
  const el=document.getElementById("stats");
  const cells=[
    {n:rows.length,l:"기능 행",c:"app"},
    {n:tables.size,l:"사용 테이블·뷰",c:"sb"},
    {n:rpcs.size,l:"사용 RPC",c:"sb"},
    {n:buckets.size,l:"사용 버킷",c:"sb"},
    {n:opCount.SEL,l:"SELECT",c:""},
    {n:opCount.INS+opCount.UPD+opCount.UPS+opCount.DEL,l:"직접 쓰기(INS/UPD/UPS/DEL)",c:""},
    {n:opCount.RPC,l:"RPC 호출",c:""},
    {n:opCount.STO,l:"Storage 작업",c:""},
  ];
  el.innerHTML=cells.map(c=>`<div class="stat ${c.c}"><div class="n">${c.n}</div><div class="l">${c.l}</div></div>`).join("");
  return {tables,rpcs,buckets};
}

function renderChips(){
  const c1=document.getElementById("chips");
  c1.innerHTML = KINDS.map(k=>`<button class="chip c-${k}" data-kind="${k}" data-on="0">${k}·${KIND_LABEL[k]}</button>`).join("")
    + Object.keys(CL_LABEL).filter(k=>k!=="mixed").map(k=>`<button class="chip" data-cl="${k}" data-on="0">${CL_LABEL[k]}</button>`).join("");
  c1.addEventListener("click",e=>{
    const b=e.target.closest(".chip"); if(!b)return;
    const on=b.dataset.on==="1"; b.dataset.on=on?"0":"1";
    if(b.dataset.kind){ on?state.kinds.delete(b.dataset.kind):state.kinds.add(b.dataset.kind); }
    if(b.dataset.cl){ on?state.cls.delete(b.dataset.cl):state.cls.add(b.dataset.cl); }
    renderMain();
  });
  document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value.trim().toLowerCase();renderMain();});
}

function renderRow(r){
  const ops=(r.o&&r.o.length?r.o:["LOC|Supabase 왕복 없음"]).map(o=>{
    const {k,t}=opParts(o);
    return `<div class="op ${k==="LOC"?"loc":""}"><span class="k k-${k}">${k}</span><span class="tgt">${esc(t||"—")}</span></div>`;
  }).join("");
  const cl=r.cl||"anon-ssr";
  const vm=r.v==="ok"?`<span class="vmark v-ok">✓</span>`:r.v==="fixed"?`<span class="vmark v-fx">✎</span>`:"";
  const localCls=rowKinds(r).has("LOC")&&rowKinds(r).size===1?" local":"";
  const warn=r.warn?` warn`:"";
  return `<div class="row${localCls}" id="${esc(r.id)}">
    <div class="feat">
      <div class="top"><span class="scr">${esc(r.s)}</span><span class="fname">${esc(r.f)}</span>${vm}<span class="own ${CL_CLASS[cl]||"own-mixed"}">${CL_LABEL[cl]||cl}</span>${r.dead?'<span class="note">DEAD</span>':""}</div>
      <div class="trig">${esc(r.id)} · ${esc(r.tr||"")}</div>
    </div>
    <div class="wire" aria-hidden="true"></div>
    <div class="targets">${ops}</div>
    ${r.e?`<div class="ev">${esc(r.e)}</div>`:""}
    ${r.m?`<div class="mnote${warn}">${esc(r.m)}</div>`:""}
  </div>`;
}

function renderMain(){
  const main=document.getElementById("app");
  let shown=0,total=0;
  main.innerHTML=PAYLOAD.AREAS.map(a=>{
    const vis=a.rows.filter(rowMatch); total+=a.rows.length; shown+=vis.length;
    if(!vis.length) return "";
    return `<section class="area"><div class="area-h"><h2>${esc(a.t)}</h2><span class="cnt">${vis.length}/${a.rows.length}행</span></div>
      ${a.d?`<p class="area-d">${esc(a.d)}</p>`:""}
      <div class="rows">${vis.map(renderRow).join("")}</div></section>`;
  }).join("");
  document.getElementById("countNote").textContent=`${shown} / ${total} 행 표시 중 · 필터: ${state.kinds.size?[...state.kinds].join(","):"전체"} · 검색: ${state.q||"—"}`;
}

  ${F.map(f=>`<div class="cat-item" id="${esc(f.id)}">
    <div class="t"><span class="sev sev-${f.sev}">${sevLabel[f.sev]||f.sev}</span><span style="font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted)">${esc(f.id)}</span> ${esc(f.t)}</div>
    <div class="ess">${esc(f.ess)}</div>
    ${f.ev?`<div class="ev2">${esc(f.ev)}</div>`:""}
  </div>`).join("")}`;
}

function renderCover(used){
  const DB=PAYLOAD.DB;
  const el=document.getElementById("cover");
  const tUsed=[...used.tables].sort(), rUsed=[...used.rpcs].sort(), bUsed=[...used.buckets].sort();
  const allTables=(DB.tables||[]).slice().sort();
  const unused=allTables.filter(t=>!used.tables.has(t)&&!used.tables.has("api_web_v1."+t));
  const bucketList=(DB.buckets||[]).map(b=>{
    const isUsed=bUsed.includes(b.id);
    return `<li>${isUsed?"":'<span class="dim">'}${esc(b.id)}${b.public?' <b style="color:var(--k-DEL)">PUBLIC</b>':""}${isUsed?"":" · 웹 미사용</span>"}</li>`;
  }).join("");
  el.innerHTML=`<h2>커버리지 — DB 실측 대비 웹 사용 현황</h2>
